    <!-- Bilingual Canonical & Alternate Links Fallback (Skipped if SSR already emitted canonical) -->
    <script>
      (function () {
        if (document.querySelector('link[rel="canonical"]')) return;
        var origin = window.location.origin || '';
        var path = window.location.pathname || '/';
        var base = origin + path;
        var links = [
          { rel: 'canonical', href: base },
          { rel: 'alternate', hreflang: 'en', href: base + '?lang=en' },
          { rel: 'alternate', hreflang: 'km', href: base + '?lang=km' },
          { rel: 'alternate', hreflang: 'x-default', href: base }
        ];
        links.forEach(function (cfg) {
          var el = document.createElement('link');
          el.rel = cfg.rel;
          if (cfg.hreflang) el.hreflang = cfg.hreflang;
          el.href = cfg.href;
          document.head.appendChild(el);
        });
      })();
    </script>
